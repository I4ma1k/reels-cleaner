version: '3.8'

services:
  reelcleaner:
    build: .
    container_name: reelcleaner
    restart: always
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
    volumes:
      - ./downloads:/app/downloads

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: reelcleaner-tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://reelcleaner:5050
    depends_on:
      - reelcleaner
